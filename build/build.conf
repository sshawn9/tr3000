BASE=$(
    cd -- "$(dirname -- "${BASH_SOURCE[0]}")"
    pwd -P
)
PROJECT=$(dirname "$BASE")
WORK="$PROJECT/.wrt"
TREE="$WORK/openwrt"
OUTPUT="$PROJECT/output"
CUSTOM="$PROJECT/customizations"
DOCKER_DIR="$BASE/docker"

CONTAINER_PROJECT=/wrt
CONTAINER_BASE="$CONTAINER_PROJECT/${BASE#"$PROJECT/"}"
CONTAINER_WORK="$CONTAINER_PROJECT/${WORK#"$PROJECT/"}"
CONTAINER_TREE="$CONTAINER_WORK/${TREE#"$WORK/"}"

OPENWRT_REPO=https://git.openwrt.org/openwrt/openwrt.git
OPENWRT_BRANCH=openwrt-25.12
JOBS=8
IMAGE=tr3000-build:debian-11
CONTAINER=tr3000-build
