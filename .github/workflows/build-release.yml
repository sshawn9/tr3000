name: Build and release firmware

on:
  push:
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Free build space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h "$GITHUB_WORKSPACE"

      - name: Read build configuration
        id: config
        run: |
          source build/build.conf
          printf 'tree=%s\n' "$TREE" >> "$GITHUB_OUTPUT"

      - name: Restore compilation cache
        id: cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ${{ steps.config.outputs.tree }}/dl
            ${{ steps.config.outputs.tree }}/.ccache
            ${{ steps.config.outputs.tree }}/build_dir
            ${{ steps.config.outputs.tree }}/staging_dir
          key: openwrt-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            openwrt-

      - name: Build firmware
        id: build
        run: bash build/build-on-ubuntu.sh -j"$(nproc)" V=s

      - name: Save compilation cache
        id: save-cache
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/cache/save@v5
        with:
          path: |
            ${{ steps.config.outputs.tree }}/dl
            ${{ steps.config.outputs.tree }}/.ccache
            ${{ steps.config.outputs.tree }}/build_dir
            ${{ steps.config.outputs.tree }}/staging_dir
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: Delete previous compilation caches
        if: ${{ !cancelled() && steps.save-cache.outcome == 'success' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          CACHE_KEY: ${{ steps.cache.outputs.cache-primary-key }}
        run: |
          caches="$(gh api --method GET --paginate \
            "repos/$GITHUB_REPOSITORY/actions/caches" \
            -f ref="$GITHUB_REF" -f key="openwrt-" -F per_page=100 \
            | jq -s '[.[].actions_caches[]]')"

          if ! jq -e --arg key "$CACHE_KEY" 'any(.[]; .key == $key)' <<< "$caches" > /dev/null; then
            echo "::warning::New compilation cache was not found; keeping existing caches."
            exit 0
          fi

          jq -r --arg key "$CACHE_KEY" '.[] | select(.key != $key) | .id' <<< "$caches" |
            while read -r cache_id; do
              echo "Deleting old compilation cache $cache_id"
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/caches/$cache_id"
            done

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source build/build.conf
          tar -czf "$RUNNER_TEMP/output.tar.gz" -C "$OUTPUT" .
          gh release create "build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}" "$RUNNER_TEMP/output.tar.gz" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --notes ""
